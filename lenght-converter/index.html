<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Converter</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>  
    <div class="len">
        <div class="lenContainer">
            <h1>Convertor</h1>
            <div class="Body grid-3">
                <div class="lenBody">
                    <div class="lenBlock">
                        <h3>cm to inches</h3>
                        <div class="lenBox">
                            <input type="text" id="inputValue" placeholder="length in cm">
                        </div>
                        <div class="button">
                            <button type="button" onclick="convertcm()">Convert</button>
                        </div>
                        <div>
                            <p id="result1">0</p>
                        </div>
                    </div>
                </div>
                <div class="lenBody">
                    <div class="lenBlock">
                        <h3>Celcius to Fahrenheit</h3>
                        <div class="lenBox">
                            <input type="text" id="input" placeholder="Value in C">
                        </div>
                        <div class="button">
                            <button type="button" onclick="convertc()">Convert</button>
                        </div>
                        <div>
                            <p id="result2">0</p>
                        </div>
                    </div>
                </div>
                <div class="lenBody">
                    <div class="lenBlock">
                        <h3>px to rem</h3>
                        <div class="lenBox">
                            <input type="text" id="pxInput" placeholder="Value in px">
                        </div>
                        <div class="button">
                            <button type="button" onclick="convertrem()">Convert</button>
                        </div>
                        <div>
                            <p id="result3">0</p>
                        </div>
                    </div>
                </div>
            </div> 
        </div>
    </div>



    <script src="./script.js"></script>
</body>

</html>
